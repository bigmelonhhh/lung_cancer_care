{% extends "layouts/base_portal.html" %}
{% load static %}

{% block extra_head %}
<script src="{% static 'web_patient/submit_guard.js' %}" defer></script>
{% endblock %}

{% block title %}当前体温{% endblock %}

{% block body %}
<div class="min-h-screen bg-[#F3F4F6] font-sans">
    
    <!-- Top Header -->
    <div class="bg-white sticky top-0 z-30 shadow-sm">
        <div class="pt-safe-top">
            <div class="flex items-center h-12 px-4 relative">
                <!-- Blue Accent Bar -->
                
                <a href="javascript:history.back()" class="absolute left-4 p-2 -ml-2 text-slate-600 active:opacity-60 z-10">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <h1 class="w-full pl-8 text-lg font-bold text-slate-800">当前体温</h1>
            </div>
        </div>
    </div>

    <div class="px-4 pt-6">
        <form method="POST" action="{% url 'web_patient:record_temperature' %}?patient_id={{ patient_id }}" id="temperature-form" class="bg-white rounded-xl shadow-sm p-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <input type="hidden" name="selected_date" value="{{ selected_date }}">
            <input type="hidden" name="record_time_touched" id="record-time-touched" value="0">
                    <!-- Main Form Card -->
                    <div class="bg-white rounded-xl shadow-sm p-5">
                        
                        <!-- 1. Measurement Time -->
                        <div class="mb-5">
                            <label class="block text-slate-700 font-bold mb-2">测量时间</label>
                            <div class="flex items-center justify-between border-b border-slate-200 pb-3 active:opacity-60 transition cursor-pointer" onclick="document.getElementById('date-picker').showPicker()">
                                <!-- 关键修改：用 now_obj（原生datetime）生成input的value，default_time直接显示 -->
                    <input type="datetime-local" id="date-picker" name="record_time" 
                        class="absolute opacity-0 w-0 h-0"
                        {% if now_obj %}value="{{ now_obj|date:'Y-m-d\TH:i' }}"{% endif %}>
                    <!-- 显示给用户的友好格式：直接用后端传的 default_time，无需过滤 -->
                    <span class="text-slate-500 text-lg font-medium" id="time-display">
                        {{ default_time }}
                    </span>
                    <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </div>


            <!-- 2. Temperature Input -->
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-3">
                    <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <label class="text-slate-800 font-bold text-lg">体温</label>
                </div>
                
                <div class="flex items-end gap-2 border-b border-slate-200 pb-2">
                    <input type="number" step="0.1" id="temperature-input"  name="temperature"
                           class="w-full text-xl font-medium text-slate-800 placeholder-slate-300 outline-none bg-transparent"
                           placeholder="点此录入">
                    <div class=" text-slate-500 font-medium mb-1">°C</span>
                </div>
            </div>
                <p id="error-msg" class="text-red-500 text-sm mt-2 hidden">请输入有效的体温数值</p>

            <!-- 3. Instructions -->
            <div class="mt-6 mb-6">
                <h3 class="text-slate-700 font-bold mb-2 text-sm">注意事项：</h3>
                <ul class="text-slate-500 text-sm space-y-1.5 leading-relaxed">
                    <li>1、确保同一部位，同一体温计；</li>
                    <li>2、腋下需 >5 分钟，口表/耳温按说明书。</li>
                </ul>
            </div>

        </div>
  </form>
  

    </div>
    
         <!-- 4. Submit Button -->
        <button id="temperature-submit-btn" type="submit" form="temperature-form" class="w-full mt-8 bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-200 active:scale-[0.98] transition hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed">
            确定
        </button>

</div>

<script>
    function showToast(message, variant = 'info') {
        const containerId = 'toast-container';
        let container = document.getElementById(containerId);
        if (!container) {
            container = document.createElement('div');
            container.id = containerId;
            container.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[9999] space-y-2 w-[92vw] max-w-sm';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        const baseClass = 'px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center justify-between gap-3';
        const variantClass = variant === 'error'
            ? 'bg-red-600 text-white'
            : variant === 'success'
                ? 'bg-emerald-600 text-white'
                : 'bg-slate-900 text-white';
        toast.className = `${baseClass} ${variantClass}`;
        toast.innerHTML = `<span class="leading-5">${String(message || '')}</span><button type="button" class="text-white/80 hover:text-white">×</button>`;
        const closeBtn = toast.querySelector('button');
        closeBtn.addEventListener('click', () => toast.remove());

        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('opacity-0', 'transition', 'duration-300');
            setTimeout(() => toast.remove(), 320);
        }, 2400);
    }

    function syncSavedRecordTime(data) {
        // 成功提交后以后端实际保存时间为准，避免展示时间与入库时间不一致。
        if (!data || !data.saved_record_time) return;
        const datePicker = document.getElementById('date-picker');
        const timeDisplay = document.getElementById('time-display');
        if (datePicker) {
            datePicker.value = data.saved_record_time;
        }
        if (timeDisplay && data.saved_record_time_display) {
            timeDisplay.innerText = data.saved_record_time_display;
        }
    }

    function writeHomePlanRefreshMarker(type) {
        try {
            const markerKey = 'home_plan_refresh_marker';
            const today = new Date();
            const dateKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const raw = localStorage.getItem(markerKey);
            const marker = raw ? JSON.parse(raw) : {};
            const completedTypes = Array.isArray(marker.completedTypes) ? marker.completedTypes : [];
            if (!completedTypes.includes(type)) {
                completedTypes.push(type);
            }
            localStorage.setItem(markerKey, JSON.stringify({
                completedTypes: completedTypes,
                date: dateKey,
                expiresAt: Date.now() + 10 * 60 * 1000
            }));
        } catch (e) {}
    }

    function submitTemperature() {
        const input = document.getElementById('temperature-input');
        const errorMsg = document.getElementById('error-msg');
        const val = parseFloat(input.value);

        if (!val ) {
            errorMsg.classList.remove('hidden');
            input.focus();
            return;
        }

        errorMsg.classList.add('hidden');
        
        // AJAX 提交逻辑
        const form = document.getElementById('temperature-form');
        const formData = new FormData(form);
        const submitBtn = document.getElementById('temperature-submit-btn');
        const submitGuard = window.LCCSubmitGuard;
        if (!submitBtn || !submitGuard) {
            showToast('提交组件加载失败，请刷新页面重试', 'error');
            return;
        }
        const selectedDate = formData.get('selected_date') || '';
        const source = (new URLSearchParams(window.location.search).get('source') || '').trim();
        const calendarUrl = "{% url 'web_patient:health_calendar' %}";
        const homeUrl = "{% url 'web_patient:patient_home' %}";
        const verifyUrl = source === 'calendar'
            ? calendarUrl + (selectedDate ? `?date=${encodeURIComponent(selectedDate)}` : '')
            : source !== 'home' && document.referrer && document.referrer.includes(window.location.host)
                ? document.referrer
                : homeUrl;

        return submitGuard.run({
            guardKey: 'record-temperature',
            button: submitBtn,
            verifyUrl: verifyUrl,
            request: () => submitGuard.postForm(form.action, formData, {
                csrfToken: formData.get('csrfmiddlewaretoken')
            }),
            getSubmissionState: (response, data) => {
                if (data && data.status === 'success') return 'succeeded';
                if (data && ['error', 'failed'].includes(data.status)) return 'failed';
                return 'pending';
            },
            getErrorMessage: data => '提交失败：' + ((data && data.message) || '未知错误'),
            onSuccess: data => {
                syncSavedRecordTime(data);
                const dateParam = selectedDate ? `?date=${encodeURIComponent(selectedDate)}` : '';
                const syncUrl = "{% url 'web_patient:query_last_metric' %}" + dateParam;

                localStorage.setItem('refresh_flag', 'true');
                fetch(syncUrl, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => showToast('网络异常，状态同步稍后完成', 'error'));

                setTimeout(() => {
                    if (source === 'home') {
                        writeHomePlanRefreshMarker('temperature');
                        window.location.replace("{% url 'web_patient:patient_home' %}?temperature=true");
                        return;
                    }
                    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
                        history.back();
                    } else {
                        window.location.href = "{% url 'web_patient:patient_home' %}";
                    }
                }, 300);
            }
        });
    }

    document.getElementById('temperature-form').addEventListener('submit', function(event) {
        event.preventDefault();
        submitTemperature();
    });
    
    // Simple date picker handler to update display (Mock)
    document.getElementById('date-picker').addEventListener('change', function(e) {
        // 用户主动改过时间后，后端需要按用户选择值保存。
        const touchedInput = document.getElementById('record-time-touched');
        if (touchedInput) {
            touchedInput.value = '1';
        }
        if(this.value) {
            const date = new Date(this.value);
            const formatted = date.getFullYear() + '/' + 
                             String(date.getMonth() + 1).padStart(2, '0') + '/' + 
                             String(date.getDate()).padStart(2, '0') + ' ' + 
                             String(date.getHours()).padStart(2, '0') + ':' + 
                             String(date.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').innerText = formatted;
        }
    });
</script>
{% endblock %}
